[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-training-planner"
version = "0.1.0"
description = "Planificador deportivo personal con Garmin y ChatGPT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "tzdata>=2025.1",
    "httpx2>=2,<3",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=44,<50",
    "filelock>=3.18,<4",
    "garminconnect>=0.3.17,<0.4",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
garmin = []

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
garmin-planner = "garmin_planner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
